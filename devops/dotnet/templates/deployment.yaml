apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-deployment
  namespace: {{ .Values.deployment.namespace }}
  labels:
    app: dotnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotnet
  template:
    metadata:
      labels:
        app: dotnet
    spec:
      containers:
      - name: dotnet
        image: butloo.azurecr.io/dotnet:{{ .Values.deployment.imagetag }}
        ports:
        - containerPort: 80